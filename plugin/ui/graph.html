<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Sensor Graph settings</title>
    <script src="sdpi-components.js"></script>
    <script src="connection.js"></script>
    <link rel="stylesheet" href="pi.css" />
  </head>
  <body>
    <div id="ha-connection"></div>

    <div class="requires-connection" hidden>
      <sdpi-item label="Sensor">
        <sdpi-select setting="entityId" datasource="getEntities" hot-reload placeholder="Select a sensor" loading="Loading sensors…"></sdpi-select>
      </sdpi-item>

      <sdpi-item label="Title">
        <sdpi-textfield setting="title" placeholder="Name of the sensor"></sdpi-textfield>
      </sdpi-item>

      <sdpi-item label="Time range">
        <sdpi-select setting="timeRange" default="6h">
          <option value="1h">Last hour</option>
          <option value="3h">Last 3 hours</option>
          <option value="6h">Last 6 hours</option>
          <option value="12h">Last 12 hours</option>
          <option value="24h">Last 24 hours</option>
        </sdpi-select>
      </sdpi-item>

      <sdpi-item label="Refresh">
        <sdpi-select setting="refreshSeconds" default="30">
          <option value="10">Every 10 seconds</option>
          <option value="30">Every 30 seconds</option>
          <option value="60">Every minute</option>
          <option value="300">Every 5 minutes</option>
        </sdpi-select>
      </sdpi-item>

      <sdpi-item label="Color">
        <sdpi-color setting="color" default="#f59e0b"></sdpi-color>
      </sdpi-item>

      <p class="hint">
        Press the key to open the history of the sensor in Home Assistant; hold it to refresh right away.
      </p>
    </div>
  </body>
</html>
